specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: UiPath
providerId: uipath
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Automation
  - RPA
  - Artificial Intelligence
  - Document Processing
  - Enterprise Automation
description: UiPath publishes one self-service tier (Automation Cloud Basic at $25 per month, EU-region
  hosting only, capped users and robots) and two contact-sales tiers (Standard and Enterprise) with custom
  pricing. A separate Test Cloud product line (Standard / Enterprise) is contact-sales only.
sources:
  - https://www.uipath.com/pricing
plans:
  - id: uipath-basic
    name: Automation Cloud Basic
    type: subscription
    description: Self-service tier for individuals and small teams. Personal automations at limited scale.
      EU-region hosting only. Bronze support level.
    entries:
      - label: Basic Subscription
        name: basic_subscription
        type: subscription
        metric: month
        limit: 1
        timeFrame: month
        geo: EU
        unit: 1
        price: '$25 per month'
        userMultiplied: false
      - label: Basic / Plus Users (max)
        name: basic_plus_users
        type: quota
        metric: seat
        limit: 5
        timeFrame: month
        geo: EU
        unit: 1
        price: included
        userMultiplied: true
      - label: Pro Users (max)
        name: pro_users
        type: quota
        metric: seat
        limit: 1
        timeFrame: month
        geo: EU
        unit: 1
        price: included
        userMultiplied: true
      - label: Robots (max)
        name: robots
        type: quota
        metric: robot
        limit: 2
        timeFrame: month
        geo: EU
        unit: 1
        price: included
        userMultiplied: false
    elements:
      - name: Personal Automations
      - name: Bronze Support
      - name: EU Region Hosting
  - id: uipath-standard
    name: Automation Cloud Standard
    type: enterprise
    description: Mid-market enterprise tier with custom pricing. Adds enterprise automations including
      AI agents, document classification and extraction, orchestration, and governance controls. Unlimited
      users, robots, and agent calls. Multiple region options or on-premises deployment.
    entries:
      - label: Custom Contract
        name: custom_contract
        type: flat
        metric: varies
        limit: -1
        timeFrame: year
        geo: configurable
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Enterprise Automations
      - name: AI Agents
      - name: Document Classification and Extraction
      - name: Orchestration
      - name: Governance Controls
      - name: Unlimited Users / Robots / Agent Calls
      - name: Multi-Region or On-Premises Deployment
  - id: uipath-enterprise
    name: Automation Cloud Enterprise
    type: enterprise
    description: Strategic company-wide tier with advanced security, self-healing UI automation, process
      monitoring/optimization, customer-managed encryption keys, and bring-your-own-model support. Custom
      pricing.
    entries:
      - label: Custom Contract
        name: custom_contract
        type: flat
        metric: varies
        limit: -1
        timeFrame: year
        geo: configurable
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Self-Healing UI Automation
      - name: Process Monitoring and Optimization
      - name: Customer-Managed Encryption Keys
      - name: Bring Your Own Model (BYOM)
      - name: Elastic Robot Orchestration
      - name: CI/CD Integration
      - name: Multi-Region or On-Premises Deployment
  - id: uipath-test-cloud-standard
    name: Test Cloud Standard
    type: enterprise
    description: Test automation tier (Standard). Includes test management, low-code / coded test design,
      and cloud execution. Custom pricing.
    entries:
      - label: Custom Contract
        name: custom_contract
        type: flat
        metric: varies
        limit: -1
        timeFrame: year
        geo: configurable
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Test Management
      - name: Low-Code and Coded Test Design
      - name: Cloud Execution
  - id: uipath-test-cloud-enterprise
    name: Test Cloud Enterprise
    type: enterprise
    description: Test automation tier (Enterprise). Adds performance testing, custom AI agents, and dedicated
      cloud deployment options. Custom pricing.
    entries:
      - label: Custom Contract
        name: custom_contract
        type: flat
        metric: varies
        limit: -1
        timeFrame: year
        geo: configurable
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Performance Testing
      - name: Custom AI Agents
      - name: Dedicated Cloud Deployment
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
