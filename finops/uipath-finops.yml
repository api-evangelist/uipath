specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: UiPath
providerId: uipath
publisherName: UiPath
serviceCategory: API
created: '2026-05-04'
modified: '2026-05-04'
tags:
  - Automation
  - Robotic Process Automation
  - RPA
  - Artificial Intelligence
  - Document Processing
  - Enterprise Automation
  - Orchestration
  - Testing
  - FinOps
  - Cost Management
  - FOCUS
description: FinOps framework definition for the UiPath API surface. Provides a FOCUS-aligned mapping
  for cost allocation, usage measurement, and unit-economics reporting across the provider's APIs.
principles:
  - name: Visibility
    description: Make API consumption costs visible to engineering, product, and finance teams in near
      real-time.
  - name: Allocation
    description: Tag every chargeable API call with the consuming team, environment, application, and
      feature so cost can be allocated.
  - name: Optimization
    description: Continuously evaluate request patterns, caching, batching, and tier selection to reduce
      cost per useful unit of work.
  - name: Accountability
    description: Establish budget owners and chargeback or showback flows for each consuming team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: UiPath
  ServiceCategory: Developer Tools / API
  ProviderName: UiPath
  PublisherName: UiPath
  InvoiceIssuerName: UiPath
  PricingCategory: Usage-Based
  PricingUnit: request
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: api_requests
    description: Count of billable API requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
      - region
      - consumer
  - name: data_egress
    description: Bytes returned over the network in API responses
    unit: GB
    aggregation: sum
    dimensions:
      - api
      - region
      - consumer
  - name: compute_seconds
    description: Server-side compute consumed by the request, where applicable
    unit: second
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
apis:
  - name: UiPath Orchestrator API
    baseURL: https://cloud.uipath.com/{organizationName}/{tenantName}/orchestrator_
    tags:
      - Orchestrator
      - Robots
      - Jobs
      - Queues
      - Automation
    serviceName: UiPath Orchestrator API
    serviceCategory: API
  - name: UiPath Automation Hub API
    baseURL: https://cloud.uipath.com/{orgName}/{tenantName}/automationhub_/api/v1
    tags:
      - Automation Hub
      - Pipeline Management
      - Center of Excellence
      - Ideas
    serviceName: UiPath Automation Hub API
    serviceCategory: API
  - name: UiPath Document Understanding API
    baseURL: https://cloud.uipath.com/{organizationName}/{tenantName}/du_
    tags:
      - Document Understanding
      - Machine Learning
      - OCR
      - Data Extraction
      - Intelligent Document Processing
    serviceName: UiPath Document Understanding API
    serviceCategory: API
  - name: UiPath Data Service API
    baseURL: https://cloud.uipath.com/{organizationName}/{tenantName}/dataservice_
    tags:
      - Data Service
      - Data Storage
      - Records
      - Entities
    serviceName: UiPath Data Service API
    serviceCategory: API
  - name: UiPath Platform Management API
    baseURL: https://cloud.uipath.com
    tags:
      - Platform Management
      - Administration
      - Organizations
      - Tenants
      - Licensing
    serviceName: UiPath Platform Management API
    serviceCategory: API
  - name: UiPath Test Manager API
    baseURL: https://cloud.uipath.com/{organizationName}/{tenantName}/testmanager_
    tags:
      - Testing
      - Quality Assurance
      - CI/CD
      - Test Automation
    serviceName: UiPath Test Manager API
    serviceCategory: API
unitEconomics:
  - name: Cost per 1K Requests
    metric: billed_cost / (api_requests / 1000)
    target: TBD
  - name: Cost per Active Consumer
    metric: billed_cost / active_consumers
    target: TBD
maintainers:
