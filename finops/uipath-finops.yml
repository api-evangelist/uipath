meters:
  - name: user_seats
    description: User entitlements (Basic, Plus, Pro) per organization
    unit: seat
    aggregation: max
    dimensions:
      - user_type
      - tier
  - name: robots
    description: Attended and unattended robots licensed per organization
    unit: robot
    aggregation: max
    dimensions:
      - robot_type
      - tier
  - name: ai_agent_calls
    description: AI agent invocations (Standard / Enterprise tiers, unlimited inside contract terms)
    unit: invocation
    aggregation: sum
    dimensions:
      - agent
      - tier
  - name: document_understanding_pages
    description: Pages processed by document classification / extraction
    unit: page
    aggregation: sum
    dimensions:
      - model
  - name: api_requests
    description: Identity Server / Orchestrator API calls (subject to per-org rate limits)
    unit: request
    aggregation: sum
    dimensions:
      - service
      - http_method
principles:
  - name: Visibility
    description: Use the Automation Cloud admin console, Insights dashboards, and Orchestrator audit
      APIs to attribute robot, user, and agent consumption per tenant and folder.
  - name: Allocation
    description: Tag automations and Orchestrator folders with consuming team / process owner so robot-hours,
      AI agent calls, and document-understanding pages can be charged back.
  - name: Optimization
    description: Right-size between Basic / Standard / Enterprise tiers, retire idle robots, batch documents
      to amortize per-page costs, and design integrations to stay under the Identity Server 5-minute
      method limits to avoid 429-driven retries.
  - name: Accountability
    description: Center-of-Excellence and platform owners review tier entitlement vs actual robot, agent,
      and document consumption ahead of each renewal.
