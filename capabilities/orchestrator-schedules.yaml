naftiko: 1.0.0-alpha2
info:
  label: UiPath Orchestrator API — Schedules
  description: 'UiPath Orchestrator API — Schedules. 1 operations. Lead operation: UiPath List Process Schedules. Self-contained
    Naftiko capability covering one Uipath business surface.'
  tags:
  - Uipath
  - Schedules
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    UIPATH_API_KEY: UIPATH_API_KEY
capability:
  consumes:
  - type: http
    namespace: orchestrator-schedules
    baseUri: https://cloud.uipath.com/{organizationName}/{tenantName}/orchestrator_
    description: UiPath Orchestrator API — Schedules business capability. Self-contained, no shared references.
    resources:
    - name: odata-ProcessSchedules
      path: /odata/ProcessSchedules
      operations:
      - name: listschedules
        method: GET
        description: UiPath List Process Schedules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.UIPATH_API_KEY}}'
  exposes:
  - type: rest
    namespace: orchestrator-schedules-rest
    port: 8080
    description: REST adapter for UiPath Orchestrator API — Schedules. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/odata/processschedules
      name: odata-processschedules
      description: REST surface for odata-ProcessSchedules.
      operations:
      - method: GET
        name: listschedules
        description: UiPath List Process Schedules
        call: orchestrator-schedules.listschedules
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: orchestrator-schedules-mcp
    port: 9090
    transport: http
    description: MCP adapter for UiPath Orchestrator API — Schedules. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: uipath-list-process-schedules
      description: UiPath List Process Schedules
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: orchestrator-schedules.listschedules
      outputParameters:
      - type: object
        mapping: $.
