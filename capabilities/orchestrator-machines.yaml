naftiko: 1.0.0-alpha2
info:
  label: UiPath Orchestrator API — Machines
  description: 'UiPath Orchestrator API — Machines. 1 operations. Lead operation: UiPath List Machines. Self-contained Naftiko
    capability covering one Uipath business surface.'
  tags:
  - Uipath
  - Machines
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    UIPATH_API_KEY: UIPATH_API_KEY
capability:
  consumes:
  - type: http
    namespace: orchestrator-machines
    baseUri: https://cloud.uipath.com/{organizationName}/{tenantName}/orchestrator_
    description: UiPath Orchestrator API — Machines business capability. Self-contained, no shared references.
    resources:
    - name: odata-Machines
      path: /odata/Machines
      operations:
      - name: listmachines
        method: GET
        description: UiPath List Machines
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.UIPATH_API_KEY}}'
  exposes:
  - type: rest
    namespace: orchestrator-machines-rest
    port: 8080
    description: REST adapter for UiPath Orchestrator API — Machines. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/odata/machines
      name: odata-machines
      description: REST surface for odata-Machines.
      operations:
      - method: GET
        name: listmachines
        description: UiPath List Machines
        call: orchestrator-machines.listmachines
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: orchestrator-machines-mcp
    port: 9090
    transport: http
    description: MCP adapter for UiPath Orchestrator API — Machines. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: uipath-list-machines
      description: UiPath List Machines
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: orchestrator-machines.listmachines
      outputParameters:
      - type: object
        mapping: $.
