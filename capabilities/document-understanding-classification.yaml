naftiko: 1.0.0-alpha2
info:
  label: UiPath Document Understanding API — Classification
  description: 'UiPath Document Understanding API — Classification. 2 operations. Lead operation: UiPath Start Asynchronous
    Document Classification. Self-contained Naftiko capability covering one Uipath business surface.'
  tags:
  - Uipath
  - Classification
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    UIPATH_API_KEY: UIPATH_API_KEY
capability:
  consumes:
  - type: http
    namespace: document-understanding-classification
    baseUri: https://cloud.uipath.com/{organizationName}/{tenantName}/du_/api/framework
    description: UiPath Document Understanding API — Classification business capability. Self-contained, no shared references.
    resources:
    - name: projects-projectId-classification-start
      path: /projects/{projectId}/classification/start
      operations:
      - name: classifydocumentasync
        method: POST
        description: UiPath Start Asynchronous Document Classification
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: api-version
          in: query
          type: string
          description: API version to use for this request
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: projects-projectId-classification-requestId-result
      path: /projects/{projectId}/classification/{requestId}/result
      operations:
      - name: getclassificationresult
        method: GET
        description: UiPath Get Asynchronous Classification Result
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: api-version
          in: query
          type: string
          description: API version to use for this request
    authentication:
      type: bearer
      token: '{{env.UIPATH_API_KEY}}'
  exposes:
  - type: rest
    namespace: document-understanding-classification-rest
    port: 8080
    description: REST adapter for UiPath Document Understanding API — Classification. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/projects/{projectid}/classification/start
      name: projects-projectid-classification-start
      description: REST surface for projects-projectId-classification-start.
      operations:
      - method: POST
        name: classifydocumentasync
        description: UiPath Start Asynchronous Document Classification
        call: document-understanding-classification.classifydocumentasync
        with:
          api-version: rest.api-version
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/projects/{projectid}/classification/{requestid}/result
      name: projects-projectid-classification-requestid-result
      description: REST surface for projects-projectId-classification-requestId-result.
      operations:
      - method: GET
        name: getclassificationresult
        description: UiPath Get Asynchronous Classification Result
        call: document-understanding-classification.getclassificationresult
        with:
          api-version: rest.api-version
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: document-understanding-classification-mcp
    port: 9090
    transport: http
    description: MCP adapter for UiPath Document Understanding API — Classification. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: uipath-start-asynchronous-document-classification
      description: UiPath Start Asynchronous Document Classification
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: document-understanding-classification.classifydocumentasync
      with:
        api-version: tools.api-version
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: uipath-get-asynchronous-classification-result
      description: UiPath Get Asynchronous Classification Result
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: document-understanding-classification.getclassificationresult
      with:
        api-version: tools.api-version
      outputParameters:
      - type: object
        mapping: $.
