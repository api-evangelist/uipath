naftiko: "1.0.0-alpha1"

info:
  label: "UiPath Test Manager API"
  description: "Enterprise test management platform for creating, executing, and reporting on automated tests."
  tags:
    - UiPath
    - Testing
    - Quality Assurance
    - Test Automation
    - CI/CD
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      UIPATH_BEARER_TOKEN: UIPATH_BEARER_TOKEN

capability:
  consumes:
    - type: http
      namespace: test-manager
      baseUri: https://cloud.uipath.com/{organizationName}/{tenantName}/testmanager_
      description: "UiPath Test Manager API for managing test projects, cases, sets, and executions."
      authentication:
        type: bearer
        token: "{{UIPATH_BEARER_TOKEN}}"
      resources:
        - name: projects
          path: /api/v2/projects
          description: "Manage test projects"
          operations:
            - name: list-projects
              method: GET
              description: "List all test projects"
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: pageSize
                  in: query
                  type: integer
                  required: false
                  description: "Results per page"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-project
              method: POST
              description: "Create a new test project"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.projectName}}"
            - name: get-project
              method: GET
              description: "Get test project details"
              inputParameters:
                - name: projectId
                  in: path
                  type: string
                  required: true
                  description: "Project identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: test-cases
          path: /api/v2/projects/{projectId}/testcases
          description: "Manage test cases within a project"
          operations:
            - name: list-test-cases
              method: GET
              description: "List test cases in a project"
              inputParameters:
                - name: projectId
                  in: path
                  type: string
                  required: true
                  description: "Project identifier"
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-test-case
              method: POST
              description: "Create a new test case"
              inputParameters:
                - name: projectId
                  in: path
                  type: string
                  required: true
                  description: "Project identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.testCaseName}}"
        - name: test-sets
          path: /api/v2/projects/{projectId}/testsets
          description: "Manage test sets for grouping test cases"
          operations:
            - name: list-test-sets
              method: GET
              description: "List test sets in a project"
              inputParameters:
                - name: projectId
                  in: path
                  type: string
                  required: true
                  description: "Project identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-test-set
              method: POST
              description: "Create a new test set"
              inputParameters:
                - name: projectId
                  in: path
                  type: string
                  required: true
                  description: "Project identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.testSetName}}"
        - name: test-executions
          path: /api/v2/projects/{projectId}/testexecutions
          description: "Track test execution results"
          operations:
            - name: list-test-executions
              method: GET
              description: "List test execution results"
              inputParameters:
                - name: projectId
                  in: path
                  type: string
                  required: true
                  description: "Project identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8104
      namespace: test-manager-api
      resources:
        - path: /v1/test-projects
          name: projects
          description: "Test project management"
          operations:
            - method: GET
              name: list-projects
              description: "List test projects"
              call: "test-manager.list-projects"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/test-executions
          name: executions
          description: "Test execution results"
          operations:
            - method: GET
              name: list-test-executions
              description: "List test executions"
              call: "test-manager.list-test-executions"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9104
      namespace: test-manager-mcp
      transport: http
      tools:
        - name: list-test-projects
          description: "List all test projects"
          hints:
            readOnly: true
            openWorld: true
          call: "test-manager.list-projects"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-test-case
          description: "Create a new test case in a project"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "test-manager.create-test-case"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-test-executions
          description: "List test execution history and results"
          hints:
            readOnly: true
            openWorld: true
          call: "test-manager.list-test-executions"
          outputParameters:
            - type: object
              mapping: "$."
