naftiko: "1.0.0-alpha1"

info:
  label: "UiPath Platform Management API"
  description: "Organization and tenant administration including user management, group management, and license allocation."
  tags:
    - UiPath
    - Platform Management
    - Administration
    - Identity
    - Licensing
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      UIPATH_BEARER_TOKEN: UIPATH_BEARER_TOKEN

capability:
  consumes:
    - type: http
      namespace: platform-management
      baseUri: https://cloud.uipath.com
      description: "UiPath Platform Management API for organization and user administration."
      authentication:
        type: bearer
        token: "{{UIPATH_BEARER_TOKEN}}"
      resources:
        - name: users
          path: /{organizationName}/identity_/api/User
          description: "Manage organization users"
          operations:
            - name: get-user
              method: GET
              description: "Get user details by ID"
              inputParameters:
                - name: organizationName
                  in: path
                  type: string
                  required: true
                  description: "Organization name"
                - name: userId
                  in: path
                  type: string
                  required: true
                  description: "User identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-user
              method: POST
              description: "Create a new user in the organization"
              inputParameters:
                - name: organizationName
                  in: path
                  type: string
                  required: true
                  description: "Organization name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  email: "{{tools.email}}"
                  name: "{{tools.name}}"
            - name: delete-user
              method: DELETE
              description: "Delete a user from the organization"
              inputParameters:
                - name: organizationName
                  in: path
                  type: string
                  required: true
                  description: "Organization name"
                - name: userId
                  in: path
                  type: string
                  required: true
                  description: "User identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: groups
          path: /{organizationName}/identity_/api/Group
          description: "Manage organization groups"
          operations:
            - name: list-groups
              method: GET
              description: "List all groups in the organization"
              inputParameters:
                - name: organizationName
                  in: path
                  type: string
                  required: true
                  description: "Organization name"
                - name: partitionGlobalId
                  in: path
                  type: string
                  required: true
                  description: "Partition global identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-group
              method: POST
              description: "Create a new group"
              inputParameters:
                - name: organizationName
                  in: path
                  type: string
                  required: true
                  description: "Organization name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.groupName}}"
        - name: audit
          path: /{organizationName}/orgaudit_/api/query/events
          description: "Query organization audit events"
          operations:
            - name: query-audit-events
              method: GET
              description: "Query organization-level audit events"
              inputParameters:
                - name: organizationName
                  in: path
                  type: string
                  required: true
                  description: "Organization name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: licenses
          path: /{organizationName}/la/api/account/{accountId}/user-license/group/{groupId}
          description: "Manage license allocations"
          operations:
            - name: get-group-license-allocation
              method: GET
              description: "Get license allocation for a group"
              inputParameters:
                - name: organizationName
                  in: path
                  type: string
                  required: true
                  description: "Organization name"
                - name: accountId
                  in: path
                  type: string
                  required: true
                  description: "Account identifier"
                - name: groupId
                  in: path
                  type: string
                  required: true
                  description: "Group identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8103
      namespace: platform-management-api
      resources:
        - path: /v1/users
          name: users
          description: "User management"
          operations:
            - method: POST
              name: create-user
              description: "Create a user"
              call: "platform-management.create-user"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/groups
          name: groups
          description: "Group management"
          operations:
            - method: GET
              name: list-groups
              description: "List groups"
              call: "platform-management.list-groups"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9103
      namespace: platform-management-mcp
      transport: http
      tools:
        - name: get-user
          description: "Get details of an organization user"
          hints:
            readOnly: true
            openWorld: true
          call: "platform-management.get-user"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-user
          description: "Create a new user in the organization"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "platform-management.create-user"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-groups
          description: "List organization groups"
          hints:
            readOnly: true
            openWorld: true
          call: "platform-management.list-groups"
          outputParameters:
            - type: object
              mapping: "$."
        - name: query-audit-events
          description: "Query organization audit log events"
          hints:
            readOnly: true
            openWorld: true
          call: "platform-management.query-audit-events"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-group-license-allocation
          description: "Get license allocation for a group"
          hints:
            readOnly: true
            openWorld: true
          call: "platform-management.get-group-license-allocation"
          outputParameters:
            - type: object
              mapping: "$."
