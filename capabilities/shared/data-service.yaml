naftiko: "1.0.0-alpha1"

info:
  label: "UiPath Data Service API"
  description: "Cloud-based structured data storage for creating and managing custom data entities and records."
  tags:
    - UiPath
    - Data Service
    - Data Storage
    - Records
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      UIPATH_BEARER_TOKEN: UIPATH_BEARER_TOKEN

capability:
  consumes:
    - type: http
      namespace: data-service
      baseUri: https://cloud.uipath.com/{organizationName}/{tenantName}/dataservice_/api/EntityService
      description: "UiPath Data Service API for managing custom data entities and records."
      authentication:
        type: bearer
        token: "{{UIPATH_BEARER_TOKEN}}"
      resources:
        - name: entities
          path: /{entityName}
          description: "Manage records for a custom entity"
          operations:
            - name: list-entity-records
              method: GET
              description: "List records for a specific entity"
              inputParameters:
                - name: entityName
                  in: path
                  type: string
                  required: true
                  description: "Entity name"
                - name: $filter
                  in: query
                  type: string
                  required: false
                  description: "OData filter expression"
                - name: $top
                  in: query
                  type: integer
                  required: false
                  description: "Maximum records to return"
                - name: $skip
                  in: query
                  type: integer
                  required: false
                  description: "Records to skip"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-entity-record
              method: POST
              description: "Create a new record for an entity"
              inputParameters:
                - name: entityName
                  in: path
                  type: string
                  required: true
                  description: "Entity name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  data: "{{tools.recordData}}"
            - name: get-entity-record
              method: GET
              description: "Get a specific entity record by ID"
              inputParameters:
                - name: entityName
                  in: path
                  type: string
                  required: true
                  description: "Entity name"
                - name: recordId
                  in: path
                  type: string
                  required: true
                  description: "Record identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-entity-record
              method: PUT
              description: "Update an existing entity record"
              inputParameters:
                - name: entityName
                  in: path
                  type: string
                  required: true
                  description: "Entity name"
                - name: recordId
                  in: path
                  type: string
                  required: true
                  description: "Record identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  data: "{{tools.recordData}}"
            - name: delete-entity-record
              method: DELETE
              description: "Delete an entity record"
              inputParameters:
                - name: entityName
                  in: path
                  type: string
                  required: true
                  description: "Entity name"
                - name: recordId
                  in: path
                  type: string
                  required: true
                  description: "Record identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: query-entity-records
              method: POST
              description: "Query entity records with complex filters"
              inputParameters:
                - name: entityName
                  in: path
                  type: string
                  required: true
                  description: "Entity name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  filter: "{{tools.filter}}"

  exposes:
    - type: rest
      port: 8105
      namespace: data-service-api
      resources:
        - path: /v1/entities/{entityName}/records
          name: records
          description: "Entity record management"
          operations:
            - method: GET
              name: list-entity-records
              description: "List entity records"
              call: "data-service.list-entity-records"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-entity-record
              description: "Create entity record"
              call: "data-service.create-entity-record"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9105
      namespace: data-service-mcp
      transport: http
      tools:
        - name: list-entity-records
          description: "List records for a data entity with filtering"
          hints:
            readOnly: true
            openWorld: true
          call: "data-service.list-entity-records"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-entity-record
          description: "Create a new record in a data entity"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "data-service.create-entity-record"
          outputParameters:
            - type: object
              mapping: "$."
        - name: query-entity-records
          description: "Query entity records with complex OData filters"
          hints:
            readOnly: true
            openWorld: true
          call: "data-service.query-entity-records"
          outputParameters:
            - type: object
              mapping: "$."
