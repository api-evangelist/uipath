naftiko: "1.0.0-alpha1"

info:
  label: "UiPath Document Understanding API"
  description: "Intelligent document processing using ML models for digitization, classification, and data extraction."
  tags:
    - UiPath
    - Document Understanding
    - OCR
    - Machine Learning
    - Data Extraction
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      UIPATH_BEARER_TOKEN: UIPATH_BEARER_TOKEN

capability:
  consumes:
    - type: http
      namespace: document-understanding
      baseUri: https://cloud.uipath.com/{organizationName}/{tenantName}/du_/api/framework
      description: "UiPath Document Understanding API for processing and extracting data from documents."
      authentication:
        type: bearer
        token: "{{UIPATH_BEARER_TOKEN}}"
      resources:
        - name: projects
          path: /projects
          description: "Manage document understanding projects"
          operations:
            - name: list-projects
              method: GET
              description: "List all document understanding projects"
              inputParameters:
                - name: api-version
                  in: query
                  type: string
                  required: false
                  description: "API version"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: list-extractors
              method: GET
              description: "List available extractors for a project"
              inputParameters:
                - name: projectId
                  in: path
                  type: string
                  required: true
                  description: "Project identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: list-classifiers
              method: GET
              description: "List available classifiers for a project"
              inputParameters:
                - name: projectId
                  in: path
                  type: string
                  required: true
                  description: "Project identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: digitization
          path: /projects/{projectId}/digitization/start
          description: "Document digitization (OCR)"
          operations:
            - name: digitize-document
              method: POST
              description: "Start document digitization (OCR processing)"
              inputParameters:
                - name: projectId
                  in: path
                  type: string
                  required: true
                  description: "Project identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  documentUrl: "{{tools.documentUrl}}"
        - name: classification
          path: /projects/{projectId}/classification/start
          description: "Document classification"
          operations:
            - name: classify-document
              method: POST
              description: "Start asynchronous document classification"
              inputParameters:
                - name: projectId
                  in: path
                  type: string
                  required: true
                  description: "Project identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  documentUrl: "{{tools.documentUrl}}"
            - name: get-classification-result
              method: GET
              description: "Get the result of a classification request"
              inputParameters:
                - name: projectId
                  in: path
                  type: string
                  required: true
                  description: "Project identifier"
                - name: requestId
                  in: path
                  type: string
                  required: true
                  description: "Classification request identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: extraction
          path: /projects/{projectId}/extraction/start
          description: "Document data extraction"
          operations:
            - name: extract-document
              method: POST
              description: "Start asynchronous document data extraction"
              inputParameters:
                - name: projectId
                  in: path
                  type: string
                  required: true
                  description: "Project identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  documentUrl: "{{tools.documentUrl}}"
                  extractorId: "{{tools.extractorId}}"
            - name: get-extraction-result
              method: GET
              description: "Get the result of a data extraction request"
              inputParameters:
                - name: projectId
                  in: path
                  type: string
                  required: true
                  description: "Project identifier"
                - name: requestId
                  in: path
                  type: string
                  required: true
                  description: "Extraction request identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8102
      namespace: document-understanding-api
      resources:
        - path: /v1/projects
          name: projects
          description: "Document understanding projects"
          operations:
            - method: GET
              name: list-projects
              description: "List projects"
              call: "document-understanding.list-projects"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/documents/digitize
          name: digitization
          description: "Document digitization"
          operations:
            - method: POST
              name: digitize-document
              description: "Digitize a document"
              call: "document-understanding.digitize-document"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/documents/extract
          name: extraction
          description: "Document extraction"
          operations:
            - method: POST
              name: extract-document
              description: "Extract data from document"
              call: "document-understanding.extract-document"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9102
      namespace: document-understanding-mcp
      transport: http
      tools:
        - name: digitize-document
          description: "Start OCR digitization of a document"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "document-understanding.digitize-document"
          outputParameters:
            - type: object
              mapping: "$."
        - name: classify-document
          description: "Classify a document using ML models"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "document-understanding.classify-document"
          outputParameters:
            - type: object
              mapping: "$."
        - name: extract-document
          description: "Extract structured data from a document"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "document-understanding.extract-document"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-extraction-result
          description: "Retrieve data extraction results"
          hints:
            readOnly: true
            openWorld: true
          call: "document-understanding.get-extraction-result"
          outputParameters:
            - type: object
              mapping: "$."
