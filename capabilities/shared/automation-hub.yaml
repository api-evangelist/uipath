naftiko: "1.0.0-alpha1"

info:
  label: "UiPath Automation Hub API"
  description: "Automation pipeline and idea management platform for Center of Excellence governance."
  tags:
    - UiPath
    - Automation Hub
    - Pipeline Management
    - Center of Excellence
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      UIPATH_AUTOMATION_HUB_API_KEY: UIPATH_AUTOMATION_HUB_API_KEY

capability:
  consumes:
    - type: http
      namespace: automation-hub
      baseUri: https://cloud.uipath.com/{orgName}/{tenantName}/automationhub_/api/v1
      description: "UiPath Automation Hub API for managing automation ideas and pipeline."
      authentication:
        type: apikey
        key: X-Authorization
        value: "{{UIPATH_AUTOMATION_HUB_API_KEY}}"
        placement: header
      resources:
        - name: automations
          path: /automations
          description: "Manage automation ideas and projects"
          operations:
            - name: list-automations
              method: GET
              description: "List automation ideas in the pipeline"
              inputParameters:
                - name: phase
                  in: query
                  type: string
                  required: false
                  description: "Filter by pipeline phase"
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter by status"
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: pageSize
                  in: query
                  type: integer
                  required: false
                  description: "Results per page"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-automation-idea
              method: POST
              description: "Submit a new automation idea"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  description: "{{tools.description}}"
            - name: get-automation
              method: GET
              description: "Get details of a specific automation"
              inputParameters:
                - name: automationId
                  in: path
                  type: string
                  required: true
                  description: "Automation identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-automation
              method: PATCH
              description: "Update automation details"
              inputParameters:
                - name: automationId
                  in: path
                  type: string
                  required: true
                  description: "Automation identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  status: "{{tools.status}}"
            - name: delete-automation
              method: DELETE
              description: "Delete an automation idea"
              inputParameters:
                - name: automationId
                  in: path
                  type: string
                  required: true
                  description: "Automation identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: pipeline
          path: /automationpipeline
          description: "View the overall automation pipeline"
          operations:
            - name: get-automation-pipeline
              method: GET
              description: "Get the automation pipeline overview"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: users
          path: /users
          description: "Manage Automation Hub users"
          operations:
            - name: list-users
              method: GET
              description: "List all users in Automation Hub"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: automation-hub-api
      resources:
        - path: /v1/automations
          name: automations
          description: "Automation ideas management"
          operations:
            - method: GET
              name: list-automations
              description: "List automation ideas"
              call: "automation-hub.list-automations"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-automation-idea
              description: "Create automation idea"
              call: "automation-hub.create-automation-idea"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: automation-hub-mcp
      transport: http
      tools:
        - name: list-automations
          description: "List automation ideas in the pipeline"
          hints:
            readOnly: true
            openWorld: true
          call: "automation-hub.list-automations"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-automation-idea
          description: "Submit a new automation idea to the pipeline"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "automation-hub.create-automation-idea"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-automation-pipeline
          description: "Get the overall automation pipeline status"
          hints:
            readOnly: true
            openWorld: true
          call: "automation-hub.get-automation-pipeline"
          outputParameters:
            - type: object
              mapping: "$."
