naftiko: "1.0.0-alpha1"

info:
  label: "UiPath Orchestrator API"
  description: "Core automation management platform for managing robots, jobs, processes, queues, assets, and schedules."
  tags:
    - UiPath
    - Orchestrator
    - Robots
    - Jobs
    - Queues
    - Automation
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      UIPATH_BEARER_TOKEN: UIPATH_BEARER_TOKEN

capability:
  consumes:
    - type: http
      namespace: orchestrator
      baseUri: https://cloud.uipath.com/{organizationName}/{tenantName}/orchestrator_
      description: "UiPath Orchestrator API for managing automation robots, jobs, queues, and assets."
      authentication:
        type: bearer
        token: "{{UIPATH_BEARER_TOKEN}}"
      resources:
        - name: jobs
          path: /odata/Jobs
          description: "Manage automation job execution"
          operations:
            - name: list-jobs
              method: GET
              description: "List automation jobs with filtering"
              inputParameters:
                - name: $top
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of records to return"
                - name: $skip
                  in: query
                  type: integer
                  required: false
                  description: "Number of records to skip"
                - name: $filter
                  in: query
                  type: string
                  required: false
                  description: "OData filter expression"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-job
              method: GET
              description: "Get a specific job by key"
              inputParameters:
                - name: key
                  in: path
                  type: integer
                  required: true
                  description: "Job identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: start-jobs
              method: POST
              description: "Start one or more automation jobs"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  startInfo: "{{tools.startInfo}}"
            - name: stop-job
              method: POST
              description: "Stop a running automation job"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  jobId: "{{tools.jobId}}"
        - name: processes
          path: /odata/Processes
          description: "Manage automation processes"
          operations:
            - name: list-processes
              method: GET
              description: "List deployed automation processes"
              inputParameters:
                - name: $top
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of records"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: queues
          path: /odata/QueueDefinitions
          description: "Manage transaction queues"
          operations:
            - name: list-queues
              method: GET
              description: "List all queue definitions"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-queue
              method: POST
              description: "Create a new queue definition"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  Name: "{{tools.queueName}}"
        - name: queue-items
          path: /odata/QueueItems
          description: "Manage queue transaction items"
          operations:
            - name: list-queue-items
              method: GET
              description: "List queue transaction items"
              inputParameters:
                - name: $filter
                  in: query
                  type: string
                  required: false
                  description: "OData filter expression"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: add-queue-item
              method: POST
              description: "Add a new item to a queue"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  itemData: "{{tools.itemData}}"
        - name: assets
          path: /odata/Assets
          description: "Manage shared assets like credentials and values"
          operations:
            - name: list-assets
              method: GET
              description: "List all shared assets"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-asset
              method: POST
              description: "Create a new shared asset"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  Name: "{{tools.assetName}}"
                  ValueType: "{{tools.valueType}}"
            - name: get-asset
              method: GET
              description: "Get a specific asset by key"
              inputParameters:
                - name: key
                  in: path
                  type: integer
                  required: true
                  description: "Asset identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-asset
              method: PUT
              description: "Update an existing asset"
              inputParameters:
                - name: key
                  in: path
                  type: integer
                  required: true
                  description: "Asset identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  Value: "{{tools.value}}"
            - name: delete-asset
              method: DELETE
              description: "Delete an asset"
              inputParameters:
                - name: key
                  in: path
                  type: integer
                  required: true
                  description: "Asset identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: robots
          path: /odata/Robots
          description: "Manage automation robots"
          operations:
            - name: list-robots
              method: GET
              description: "List all registered robots"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: alerts
          path: /odata/Alerts
          description: "Retrieve system and automation alerts"
          operations:
            - name: list-alerts
              method: GET
              description: "List system alerts and notifications"
              inputParameters:
                - name: $filter
                  in: query
                  type: string
                  required: false
                  description: "OData filter expression"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: webhooks
          path: /odata/Webhooks
          description: "Manage webhook subscriptions"
          operations:
            - name: list-webhooks
              method: GET
              description: "List all webhook subscriptions"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-webhook
              method: POST
              description: "Create a new webhook subscription"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  Url: "{{tools.webhookUrl}}"
                  EventTypes: "{{tools.eventTypes}}"
            - name: delete-webhook
              method: DELETE
              description: "Delete a webhook subscription"
              inputParameters:
                - name: key
                  in: path
                  type: integer
                  required: true
                  description: "Webhook identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: orchestrator-api
      resources:
        - path: /v1/jobs
          name: jobs
          description: "Automation jobs management"
          operations:
            - method: GET
              name: list-jobs
              description: "List automation jobs"
              call: "orchestrator.list-jobs"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: start-jobs
              description: "Start automation jobs"
              call: "orchestrator.start-jobs"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/queues
          name: queues
          description: "Transaction queue management"
          operations:
            - method: GET
              name: list-queues
              description: "List queues"
              call: "orchestrator.list-queues"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/assets
          name: assets
          description: "Shared asset management"
          operations:
            - method: GET
              name: list-assets
              description: "List assets"
              call: "orchestrator.list-assets"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: orchestrator-mcp
      transport: http
      tools:
        - name: list-jobs
          description: "List automation jobs with optional filtering"
          hints:
            readOnly: true
            openWorld: true
          call: "orchestrator.list-jobs"
          outputParameters:
            - type: object
              mapping: "$."
        - name: start-jobs
          description: "Start one or more automation jobs"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "orchestrator.start-jobs"
          outputParameters:
            - type: object
              mapping: "$."
        - name: stop-job
          description: "Stop a running automation job"
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "orchestrator.stop-job"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-queues
          description: "List all transaction queue definitions"
          hints:
            readOnly: true
            openWorld: true
          call: "orchestrator.list-queues"
          outputParameters:
            - type: object
              mapping: "$."
        - name: add-queue-item
          description: "Add a transaction item to a queue"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "orchestrator.add-queue-item"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-assets
          description: "List all shared assets"
          hints:
            readOnly: true
            openWorld: true
          call: "orchestrator.list-assets"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-robots
          description: "List all registered automation robots"
          hints:
            readOnly: true
            openWorld: true
          call: "orchestrator.list-robots"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-alerts
          description: "List system and automation alerts"
          hints:
            readOnly: true
            openWorld: true
          call: "orchestrator.list-alerts"
          outputParameters:
            - type: object
              mapping: "$."
