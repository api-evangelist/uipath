naftiko: 1.0.0-alpha2
info:
  label: UiPath Orchestrator API — Users
  description: 'UiPath Orchestrator API — Users. 1 operations. Lead operation: UiPath List Users. Self-contained Naftiko capability
    covering one Uipath business surface.'
  tags:
  - Uipath
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    UIPATH_API_KEY: UIPATH_API_KEY
capability:
  consumes:
  - type: http
    namespace: orchestrator-users
    baseUri: https://cloud.uipath.com/{organizationName}/{tenantName}/orchestrator_
    description: UiPath Orchestrator API — Users business capability. Self-contained, no shared references.
    resources:
    - name: odata-Users
      path: /odata/Users
      operations:
      - name: listusers
        method: GET
        description: UiPath List Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.UIPATH_API_KEY}}'
  exposes:
  - type: rest
    namespace: orchestrator-users-rest
    port: 8080
    description: REST adapter for UiPath Orchestrator API — Users. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/odata/users
      name: odata-users
      description: REST surface for odata-Users.
      operations:
      - method: GET
        name: listusers
        description: UiPath List Users
        call: orchestrator-users.listusers
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: orchestrator-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for UiPath Orchestrator API — Users. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: uipath-list-users
      description: UiPath List Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: orchestrator-users.listusers
      outputParameters:
      - type: object
        mapping: $.
