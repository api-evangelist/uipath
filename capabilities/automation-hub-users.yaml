naftiko: 1.0.0-alpha2
info:
  label: UiPath Automation Hub API — Users
  description: 'UiPath Automation Hub API — Users. 4 operations. Lead operation: UiPath Add a User. Self-contained Naftiko
    capability covering one Uipath business surface.'
  tags:
  - Uipath
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    UIPATH_API_KEY: UIPATH_API_KEY
capability:
  consumes:
  - type: http
    namespace: automation-hub-users
    baseUri: https://cloud.uipath.com/{orgName}/{tenantName}/automationhub_/api/v1
    description: UiPath Automation Hub API — Users business capability. Self-contained, no shared references.
    resources:
    - name: adduser
      path: /adduser
      operations:
      - name: adduser
        method: POST
        description: UiPath Add a User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: edituser
      path: /edituser
      operations:
      - name: edituser
        method: POST
        description: UiPath Edit a User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: roles
      path: /roles
      operations:
      - name: listroles
        method: GET
        description: UiPath List Roles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: users
      path: /users
      operations:
      - name: listusers
        method: GET
        description: UiPath List Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
          description: Page number for pagination (1-based)
        - name: pageSize
          in: query
          type: integer
          description: Number of records per page
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.UIPATH_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: automation-hub-users-rest
    port: 8080
    description: REST adapter for UiPath Automation Hub API — Users. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/adduser
      name: adduser
      description: REST surface for adduser.
      operations:
      - method: POST
        name: adduser
        description: UiPath Add a User
        call: automation-hub-users.adduser
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/edituser
      name: edituser
      description: REST surface for edituser.
      operations:
      - method: POST
        name: edituser
        description: UiPath Edit a User
        call: automation-hub-users.edituser
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/roles
      name: roles
      description: REST surface for roles.
      operations:
      - method: GET
        name: listroles
        description: UiPath List Roles
        call: automation-hub-users.listroles
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users
      name: users
      description: REST surface for users.
      operations:
      - method: GET
        name: listusers
        description: UiPath List Users
        call: automation-hub-users.listusers
        with:
          page: rest.page
          pageSize: rest.pageSize
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: automation-hub-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for UiPath Automation Hub API — Users. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: uipath-add-user
      description: UiPath Add a User
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: automation-hub-users.adduser
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: uipath-edit-user
      description: UiPath Edit a User
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: automation-hub-users.edituser
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: uipath-list-roles
      description: UiPath List Roles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: automation-hub-users.listroles
      outputParameters:
      - type: object
        mapping: $.
    - name: uipath-list-users
      description: UiPath List Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: automation-hub-users.listusers
      with:
        page: tools.page
        pageSize: tools.pageSize
      outputParameters:
      - type: object
        mapping: $.
