      name: odata-storagebuckets
      description: REST surface for odata-StorageBuckets.
      operations:
      - method: GET
        name: liststoragebuckets
        description: UiPath List Storage Buckets
        call: orchestrator-storagebuckets.liststoragebuckets
        outputParameters:
        - type: object
          mapping: $.
