naftiko: 1.0.0-alpha2
info:
  label: UiPath Orchestrator API — Robots
  description: 'UiPath Orchestrator API — Robots. 1 operations. Lead operation: UiPath List Robots. Self-contained Naftiko
    capability covering one Uipath business surface.'
  tags:
  - Uipath
  - Robots
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    UIPATH_API_KEY: UIPATH_API_KEY
capability:
  consumes:
  - type: http
    namespace: orchestrator-robots
    baseUri: https://cloud.uipath.com/{organizationName}/{tenantName}/orchestrator_
    description: UiPath Orchestrator API — Robots business capability. Self-contained, no shared references.
    resources:
    - name: odata-Robots
      path: /odata/Robots
      operations:
      - name: listrobots
        method: GET
        description: UiPath List Robots
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.UIPATH_API_KEY}}'
  exposes:
  - type: rest
    namespace: orchestrator-robots-rest
    port: 8080
    description: REST adapter for UiPath Orchestrator API — Robots. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/odata/robots
      name: odata-robots
      description: REST surface for odata-Robots.
      operations:
      - method: GET
        name: listrobots
        description: UiPath List Robots
        call: orchestrator-robots.listrobots
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: orchestrator-robots-mcp
    port: 9090
    transport: http
    description: MCP adapter for UiPath Orchestrator API — Robots. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: uipath-list-robots
      description: UiPath List Robots
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: orchestrator-robots.listrobots
      outputParameters:
      - type: object
        mapping: $.
