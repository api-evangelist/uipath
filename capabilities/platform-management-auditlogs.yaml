    namespace: platform-management-auditlogs-rest
    port: 8080
    description: REST adapter for UiPath Platform Management API — AuditLogs. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/{organizationname}/orgaudit/api/query/events
      name: organizationname-orgaudit-api-query-events
      description: REST surface for organizationName-orgaudit_-api-query-events.
      operations:
      - method: GET
        name: queryorganizationauditevents
        description: UiPath Query Organization Audit Events
        call: platform-management-auditlogs.queryorganizationauditevents
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/{organizationname}/orgaudit/api/query/sources
      name: organizationname-orgaudit-api-query-sources
      description: REST surface for organizationName-orgaudit_-api-query-sources.
      operations:
      - method: GET
        name: getorganizationauditsources
        description: UiPath Get Organization Audit Event Sources
        call: platform-management-auditlogs.getorganizationauditsources
        outputParameters:
        - type: object
