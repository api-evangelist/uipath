naftiko: 1.0.0-alpha2
info:
  label: UiPath Platform Management API — AuditLogs
  description: 'UiPath Platform Management API — AuditLogs. 3 operations. Lead operation: UiPath Query Organization Audit
    Events. Self-contained Naftiko capability covering one Uipath business surface.'
  tags:
  - Uipath
  - AuditLogs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    UIPATH_API_KEY: UIPATH_API_KEY
capability:
