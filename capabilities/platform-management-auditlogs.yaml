  - type: http
    namespace: platform-management-auditlogs
    baseUri: https://cloud.uipath.com
    description: UiPath Platform Management API — AuditLogs business capability. Self-contained, no shared references.
    resources:
    - name: organizationName-orgaudit_-api-query-events
      path: /{organizationName}/orgaudit_/api/query/events
      operations:
      - name: queryorganizationauditevents
        method: GET
        description: UiPath Query Organization Audit Events
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: organizationName-orgaudit_-api-query-sources
      path: /{organizationName}/orgaudit_/api/query/sources
      operations:
      - name: getorganizationauditsources
        method: GET
        description: UiPath Get Organization Audit Event Sources
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: organizationName-tenantName-tenantaudit_-api-query-events
      path: /{organizationName}/{tenantName}/tenantaudit_/api/query/events
      operations:
      - name: querytenantauditevents
        method: GET
        description: UiPath Query Tenant Audit Events
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.UIPATH_API_KEY}}'
  exposes:
